<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roopik Sandbox</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
    }

    #root {
      width: 100%;
      height: 100vh;
      overflow: auto;
    }

    /* Error display */
    .sandbox-error {
      padding: 20px;
      background: #fee;
      border-left: 4px solid #c33;
      color: #c33;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    /**
     * Roopik Sandbox Runtime
     *
     * This sandbox executes PRE-TRANSFORMED code from ESBuild.
     * No Babel, no transpilation - code is already bundled!
     */

    let sandboxId = null;

    // Listen for code execution requests from parent
    window.addEventListener('message', async (event) => {
      const { type, data } = event.data;

      if (type === 'execute') {
        sandboxId = data.sandboxId;
        const code = data.code;

        try {
          // Code is ALREADY:
          // - Bundled by ESBuild
          // - Imports converted to CDN URLs
          // - Framework wrappers added
          // - CSS injected (if any)

          // Just execute it!
          eval(code);

          // Notify parent of success
          window.parent.postMessage({
            type: 'rendered',
            sandboxId: sandboxId
          }, '*');

        } catch (error) {
          // Show error in sandbox
          const errorDiv = document.createElement('div');
          errorDiv.className = 'sandbox-error';
          errorDiv.textContent = `Error: ${error.message}\n\nStack:\n${error.stack}`;
          document.getElementById('root').appendChild(errorDiv);

          // Notify parent of error
          window.parent.postMessage({
            type: 'error',
            sandboxId: sandboxId,
            error: {
              message: error.message,
              stack: error.stack
            }
          }, '*');
        }
      }

      // Handle cleanup
      if (type === 'cleanup') {
        document.getElementById('root').innerHTML = '';
      }
    });

    // Notify parent that sandbox is ready
    window.parent.postMessage({ type: 'ready' }, '*');

    // Global error handler
    window.addEventListener('error', (event) => {
      window.parent.postMessage({
        type: 'error',
        sandboxId: sandboxId,
        error: {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno
        }
      }, '*');
    });

    // Unhandled promise rejection handler
    window.addEventListener('unhandledrejection', (event) => {
      window.parent.postMessage({
        type: 'error',
        sandboxId: sandboxId,
        error: {
          message: `Unhandled Promise Rejection: ${event.reason}`
        }
      }, '*');
    });
  </script>
</body>
</html>
