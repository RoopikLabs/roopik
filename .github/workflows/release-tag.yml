name: Release - Create Tag

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag from package.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve next tag from package.json version
        id: resolve
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [ -z "$BASE" ]; then
            echo "::error::package.json has no version field"
            exit 1
          fi
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)
          CANDIDATE="v${MAJOR}.${MINOR}.${PATCH}"
          while git rev-parse --quiet --verify "refs/tags/${CANDIDATE}" >/dev/null; do
            PATCH=$((PATCH + 1))
            CANDIDATE="v${MAJOR}.${MINOR}.${PATCH}"
          done
          echo "tag=${CANDIDATE}" >> "$GITHUB_OUTPUT"
          echo "Will release as ${CANDIDATE} (package.json base: ${BASE})"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Pushed tag $TAG to origin. Platform builds will trigger now."
