# Platforms: Windows x64, macOS arm64 (Apple Silicon), Linux x64

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Manual trigger

jobs:
  # ============================================
  # WINDOWS BUILDS
  # ============================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx

      - name: Run preinstall script manually
        run: tsx build/npm/preinstall.ts

      - name: Install dependencies (skip scripts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --ignore-scripts

      - name: Run postinstall script manually
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tsx build/npm/postinstall.ts

      - name: Install roopik-roo extension dependencies
        working-directory: extensions/roopik-roo
        run: |
          if ! npm install; then
            echo "Normal install failed, trying with --legacy-peer-deps..."
            npm install --legacy-peer-deps
            node ../../.github/scripts/install-all-peer-deps.js || true
          fi

      - name: Install roopik extension dependencies (skip postinstall)
        working-directory: extensions/roopik
        run: npm install --ignore-scripts

      - name: Install roopik webview dependencies
        working-directory: extensions/roopik/webview
        run: npm install

      - name: Build roopik extension
        working-directory: extensions/roopik
        run: npm run build

      - name: Build roopik-roo extension
        working-directory: extensions/roopik-roo
        run: npm run build

      - name: Build Windows application
        run: npm run gulp vscode-win32-x64

      - name: Prepare Inno Setup tools
        run: npm run gulp vscode-win32-x64-inno-updater

      - name: Build Windows installer (User)
        run: npm run gulp vscode-win32-x64-user-setup

      - name: Build Windows installer (System)
        run: npm run gulp vscode-win32-x64-system-setup

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: roopik-windows-x64
          path: |
            VSCode-win32-x64/
            .build/win32-x64/user-setup/
            .build/win32-x64/system-setup/
          retention-days: 30

  # ============================================
  # macOS BUILDS (ARM64)
  # ============================================
  build-macos-arm64:
    name: Build macOS (ARM64)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx

      - name: Run preinstall script manually
        run: tsx build/npm/preinstall.ts

      - name: Install dependencies (skip scripts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --ignore-scripts

      - name: Run postinstall script manually
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tsx build/npm/postinstall.ts

      - name: Install roopik-roo extension dependencies
        working-directory: extensions/roopik-roo
        run: |
          if ! npm install; then
            echo "Normal install failed, trying with --legacy-peer-deps..."
            npm install --legacy-peer-deps
            node ../../.github/scripts/install-all-peer-deps.js || true
          fi

      - name: Install roopik extension dependencies (skip postinstall)
        working-directory: extensions/roopik
        run: npm install --ignore-scripts

      - name: Install roopik webview dependencies
        working-directory: extensions/roopik/webview
        run: npm install

      - name: Build roopik extension
        working-directory: extensions/roopik
        run: npm run build

      - name: Build roopik-roo extension
        working-directory: extensions/roopik-roo
        run: npm run build

      - name: Build macOS application (arm64)
        run: npm run gulp vscode-darwin-arm64

      - name: Upload macOS artifacts (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: roopik-macos-arm64
          path: |
            VSCode-darwin-arm64/
          retention-days: 30

  # ============================================
  # LINUX BUILDS (x64)
  # ============================================
  build-linux-x64:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx

      - name: Setup GCC
        uses: egor-tensin/setup-gcc@v1
        with:
          version: 10
          platform: x64

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev \
            fakeroot \
            build-essential \
            pkg-config \
            libkrb5-dev

          # Install snapcraft via snap (optional, for Snap packages)
          # Uncomment if you need Snap package builds
          # sudo snap install snapcraft --classic

      - name: Run preinstall script manually
        run: tsx build/npm/preinstall.ts

      - name: Install dependencies (skip scripts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm install --ignore-scripts

      - name: Run postinstall script manually
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tsx build/npm/postinstall.ts

      - name: Install roopik-roo extension dependencies
        working-directory: extensions/roopik-roo
        run: |
          if ! npm install; then
            echo "Normal install failed, trying with --legacy-peer-deps..."
            npm install --legacy-peer-deps
            node ../../.github/scripts/install-all-peer-deps.js || true
          fi

      - name: Install roopik extension dependencies (skip postinstall)
        working-directory: extensions/roopik
        run: npm install --ignore-scripts

      - name: Install roopik webview dependencies
        working-directory: extensions/roopik/webview
        run: npm install

      - name: Build roopik extension
        working-directory: extensions/roopik
        run: npm run build

      - name: Build roopik-roo extension
        working-directory: extensions/roopik-roo
        run: npm run build

      - name: Build Linux application (x64)
        run: npm run gulp vscode-linux-x64

      - name: Prepare DEB package
        run: npm run gulp vscode-linux-x64-prepare-deb

      - name: Build DEB package
        run: npm run gulp vscode-linux-x64-build-deb

      # RPM and Snap builds are optional - uncomment if needed
      # Note: RPM builds require rpm-build tools (typically on RHEL/CentOS)
      # Snap builds require snapcraft (installed above)
      # - name: Prepare RPM package
      #   run: npm run gulp vscode-linux-x64-prepare-rpm
      #   continue-on-error: true
      #
      # - name: Build RPM package
      #   run: npm run gulp vscode-linux-x64-build-rpm
      #   continue-on-error: true
      #
      # - name: Prepare Snap package
      #   run: npm run gulp vscode-linux-x64-prepare-snap
      #   continue-on-error: true
      #
      # - name: Build Snap package
      #   run: npm run gulp vscode-linux-x64-build-snap
      #   continue-on-error: true

      - name: Upload Linux artifacts (x64)
        uses: actions/upload-artifact@v4
        with:
          name: roopik-linux-x64
          path: |
            VSCode-linux-x64/
            .build/linux/deb/amd64/
          retention-days: 30

  # ============================================
  # SUMMARY JOB (runs after all builds)
  # ============================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos-arm64, build-linux-x64]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | x64 | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | arm64 (Apple Silicon M1/M2/M3/M4/M5) | ${{ needs.build-macos-arm64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | x64 | ${{ needs.build-linux-x64.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All artifacts are available in the workflow run artifacts." >> $GITHUB_STEP_SUMMARY

